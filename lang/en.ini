cli.usage = BootHop - the next start of this PC (once) from a WIM, VHD or VHDX file.
cli.usage +=
cli.usage += BootHop /boot <file> [/index N] [/restart] [/copysdi [/deletesdi]]
cli.usage +=     makes the boot entry without asking (a UAC prompt comes up).
cli.usage +=     /index N   the image of a WIM (default: the only one, else the boot image)
cli.usage +=     /restart   restart at once when it is done
cli.usage +=     /copysdi   copy boot.sdi next to the WIM (else the one of Windows is used)
cli.usage +=     /deletesdi  with /copysdi: delete the copied boot.sdi after the restart
cli.usage += BootHop /status
cli.usage +=     whether the next start is from BootHop (exit code 0 = yes, 1 = no)
cli.usage += BootHop /cancel
cli.usage +=     takes the entry of BootHop out of the next start and deletes it
cli.usage += BootHop [file]
cli.usage +=     without a command: the window (the boot list, or the file)
cli.usage +=
cli.usage += Exit codes: 0 done, 1 failed, 2 wrong arguments, 1223 UAC cancelled.
cli.unknown = Unknown argument: {0}
cli.bad_index = /index needs an image number from 1: {0}
cli.need_index = {0} has {1} images and none is the boot image: choose one with /index N.
cli.no_index = {0} has no image {1}.
cli.uac_cancelled = Cancelled at the UAC prompt.
cli.done = Done: the next start (once) is from {0}.
