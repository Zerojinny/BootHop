ob.copy_sdi_tip = WIM 부팅에는 boot.sdi(빈 RAM 디스크)가 필요합니다. 끄면(기본) Windows의 파일(C:\Windows\Boot\DVD\EFI\boot.sdi)을 쓰고 아무것도 쓰지 않습니다. 켜면 WIM 파일 옆에 복사합니다. Windows PE에서는 항상 복사합니다 (X: 드라이브는 다음 부팅에 없음).
ob.setting_failed = 설정을 저장하지 못했습니다 (HKCU\Software\BootHop).
ob.delete_sdi = 다시 시작한 뒤 boot.sdi 지우기
ob.delete_sdi_tip = WIM 옆에 복사한 boot.sdi를 PC가 다시 시작한 뒤 처음 로그온할 때 지웁니다. boot.sdi를 복사할 때만 쓰입니다.
