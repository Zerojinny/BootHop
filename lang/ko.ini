; ============================================================
;  BootHop - Korean language file (lang\ko.ini)
;  Missing keys are taken from en.ini.
;  The texts come from WimSmith's lang\ko.ini (keys rb.*, fd.*, ...).
;
;  key = text           one line
;  key += text          adds a line to the text above
;  {0}, {1} ...         filled in by the program, keep them
;  Lines starting with ; are comments. Save as UTF-8.
; ============================================================

[meta]
name = 한국어
; 창 전체에 쓰는 글꼴 (설치되어 있어야 함)
font = Malgun Gothic

