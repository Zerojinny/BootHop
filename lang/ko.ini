cli.usage = BootHop - 이 PC의 다음 부팅(한 번)을 WIM, VHD, VHDX 파일로 합니다.
cli.usage +=
cli.usage += BootHop /boot <파일> [/index N] [/restart] [/copysdi [/deletesdi]]
cli.usage +=     묻지 않고 부팅 항목을 만듭니다 (UAC 창은 뜹니다).
cli.usage +=     /index N   WIM의 이미지 번호 (기본: 이미지가 하나면 그것, 아니면 부팅 이미지)
cli.usage +=     /restart   끝나면 바로 다시 시작
cli.usage +=     /copysdi   boot.sdi를 WIM 옆에 복사 (지정하지 않으면 Windows의 파일 사용)
cli.usage +=     /deletesdi  /copysdi 와 함께: 복사한 boot.sdi를 다시 시작한 뒤 지움
cli.usage += BootHop /status
cli.usage +=     다음 부팅이 BootHop 항목인지 (종료 코드 0 = 예, 1 = 아니오)
