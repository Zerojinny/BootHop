rb.confirm += 그때까지 WIM 파일은 이 드라이브(NTFS / FAT32, BitLocker 아님)에 그대로 있어야 합니다.
rb.confirm_set_boot = 파일의 부팅 이미지를 {0}에서 {1}(으)로 바꿉니다 (RAM 디스크는 부팅 이미지로 부팅).
rb.confirm_set_boot_none = 이미지 {0}을(를) 파일의 부팅 이미지로 지정합니다 (RAM 디스크는 부팅 이미지로 부팅).
rb.confirm_sdi = Windows의 boot.sdi를 {0}에 복사합니다.
rb.confirm_sdi_delete = 원래 Windows로 다시 시작한 뒤 처음 로그온할 때 지웁니다.
